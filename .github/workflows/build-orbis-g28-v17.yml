name: Build Orbis G28 Lab v1.7 Official 4K Callback Semantics

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-lab-v1-7-official-4k-callback"]
    paths:
      - ".github/workflows/build-orbis-g28-v17.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-orbis-g28-v17.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-v17:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.6 source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8840999839/zip" \
            -o /tmp/v16-source-artifact.zip
          mkdir -p /tmp/v16-artifact android/OrbisG28V17App
          unzip -q /tmp/v16-source-artifact.zip -d /tmp/v16-artifact
          test -s /tmp/v16-artifact/Orbis-G28-Lab-v1.6-source.zip
          unzip -q /tmp/v16-artifact/Orbis-G28-Lab-v1.6-source.zip -d android/OrbisG28V17App
          test -s android/OrbisG28V17App/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java

      - name: Apply official HryFine 4K callback semantics
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/v17_patch.py
          python3 /tmp/v17_patch.py

      - name: Validate official callback routing
        run: |
          set -euo pipefail
          APP="android/OrbisG28V17App"
          JAVA="$APP/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java"
          MAIN="$APP/app/src/main/java/com/orbisg28siliconcensus/MainActivity.java"
          grep -q "ORBIS G28 LAB — RESGATE v1.7" "$JAVA"
          grep -q "boolean official4kCallback = command == 0x02" "$JAVA"
          grep -q "status == 1 || official4kCallback" "$JAVA"
          grep -q "SEMÂNTICA OFICIAL: D6/0x02 curto" "$JAVA"
          grep -q "CALLBACK 4K part=" "$JAVA"
          grep -q "HryFine declara OTAFinish imediatamente" "$JAVA"
          grep -q "versionCode 170" "$APP/app/build.gradle"
          grep -q "versionName '1.7-official-4k-callback'" "$APP/app/build.gradle"
          grep -q "callback 4K idêntico ao HryFine" "$MAIN"
          echo "Orbis G28 Lab v1.7 official callback validation passed"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28V17App clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          set -euo pipefail
          APP="android/OrbisG28V17App"
          mkdir -p dist/source
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Lab-v1.7.apk
          cp -R "$APP"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -qr ../Orbis-G28-Lab-v1.7-source.zip .)
          sha256sum dist/Orbis-G28-Lab-v1.7.apk | tee dist/Orbis-G28-Lab-v1.7.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.7
          path: |
            dist/Orbis-G28-Lab-v1.7.apk
            dist/Orbis-G28-Lab-v1.7.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.7-source
          path: dist/Orbis-G28-Lab-v1.7-source.zip
          if-no-files-found: error
          retention-days: 30
