name: Extract HryFine OTA flow

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-hryfine-auth.yml"
      - "tools/hryfine-auth/**"

permissions:
  contents: read

jobs:
  extract-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official-signed HryFine APK
        run: |
          set -euxo pipefail
          mkdir -p work
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.lianhezhuli.hyfit?version=latest' \
            -o work/HryFine.apk
          test -s work/HryFine.apk
          file work/HryFine.apk
          unzip -t work/HryFine.apk >/dev/null
          sha256sum work/HryFine.apk | tee work/HryFine.sha256

      - name: Download JADX
        run: |
          set -euxo pipefail
          curl -fL --retry 4 \
            'https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip' \
            -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx

      - name: Decompile OTA and authentication classes
        run: |
          set -euxo pipefail
          work/jadx/bin/jadx --no-res --show-bad-code --threads-count 4 \
            -d work/decoded work/HryFine.apk || true
          test -d work/decoded/sources
          mkdir -p work/ota

          find work/decoded/sources -type f \( \
            -name 'Constans.java' -o \
            -name 'SignUtils.java' -o \
            -name 'StringUtils.java' -o \
            -name 'PhoneDeviceUtil.java' -o \
            -name 'GeneralUtils.java' -o \
            -name 'AppUpdateUtils.java' -o \
            -name 'Request.java' -o \
            -name 'RequestUtils.java' -o \
            -name 'NetWorkRequest.java' -o \
            -name 'NetWorkManager.java' -o \
            -name 'DeviceOtaActivity.java' -o \
            -iname '*Ota*.java' -o \
            -iname '*OTA*.java' \
          \) -print -exec cp --parents '{}' work/ota/ \;

          grep -RlE \
            'ead8ff5fe2f9385b55e6e509cf311a35|unique_code|getDeviceOta|getDeviceOTA|requestOTAInfo|requestStartOTA' \
            work/decoded/sources/com/lianhezhuli/hyfit \
            | while IFS= read -r file; do
                cp --parents "$file" work/ota/
              done

          grep -RniE \
            'getQueryMap|random|nonce|timestamp|bundle_id|appid|getSign|get_update|unique_code|requestOTAInfo|requestStartOTA|bin_list|firmware|device_ota|ota/' \
            work/decoded/sources/com/lianhezhuli/hyfit \
            > work/ota/search-results.txt || true

          for file in \
            work/decoded/sources/com/lianhezhuli/hyfit/network/request/RequestUtils.java \
            work/decoded/sources/com/lianhezhuli/hyfit/network/request/Request.java \
            work/decoded/sources/com/lianhezhuli/hyfit/utils/AppUpdateUtils.java; do
            if test -f "$file"; then
              {
                echo "===== $file ====="
                grep -nC 70 -E \
                  'ead8ff5fe2f9385b55e6e509cf311a35|unique_code|get_update|OTA|Ota|ota|bin_list' \
                  "$file" || true
              } >> work/ota/ota-context.txt
            fi
          done

          test -s work/ota/search-results.txt
          test -s work/ota/ota-context.txt
          find work/ota -type f -maxdepth 30 -print | sort

      - name: Package extracted source
        run: |
          cd work
          zip -qr HryFine-ota-extraction.zip ota HryFine.sha256

      - name: Upload OTA extraction
        uses: actions/upload-artifact@v4
        with:
          name: HryFine-ota-extraction
          path: work/HryFine-ota-extraction.zip
          if-no-files-found: error
          retention-days: 7
