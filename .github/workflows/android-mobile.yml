name: Android Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-experimental
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-mobile.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p mobile/android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Orbis-Watch-Lab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Watch-Lab-Android
          path: Orbis-Watch-Lab-debug.apk
          if-no-files-found: error
          retention-days: 30
