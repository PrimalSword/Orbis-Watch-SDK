name: Build Orbis G28 Lab v1.5 Exact MTU

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-lab-v1-5-exact-mtu-minus-14"]
    paths:
      - "android/OrbisG28Unified/patch_v15_exact_mtu.py"
      - ".github/workflows/build-orbis-g28-v15.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28Unified/patch_v15_exact_mtu.py"
      - ".github/workflows/build-orbis-g28-v15.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.4 source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8840686064/zip" \
            -o /tmp/v14-source-artifact.zip
          mkdir -p /tmp/v14-artifact android/OrbisG28V15App
          unzip -q /tmp/v14-source-artifact.zip -d /tmp/v14-artifact
          test -s /tmp/v14-artifact/Orbis-G28-Lab-v1.4-source.zip
          unzip -q /tmp/v14-artifact/Orbis-G28-Lab-v1.4-source.zip -d android/OrbisG28V15App

      - name: Apply v1.5 exact MTU minus 14 patch
        run: python android/OrbisG28Unified/patch_v15_exact_mtu.py android/OrbisG28V15App

      - name: Validate exact official fragmentation
        run: |
          set -euo pipefail
          APP="android/OrbisG28V15App"
          JAVA="$APP/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java"
          grep -q "ORBIS G28 LAB — RESGATE v1.5" "$JAVA"
          grep -q "return Math.max(1, negotiatedMtu - 14);" "$JAVA"
          ! grep -q "Math.min(240, negotiatedMtu - 14)" "$JAVA"
          grep -q "PAYLOAD 5610 OFICIAL: MTU-14=" "$JAVA"
          grep -q "versionCode 150" "$APP/app/build.gradle"
          grep -q "versionName '1.5-exact-mtu-minus-14'" "$APP/app/build.gradle"
          echo "v1.5 exact MTU-14 validation passed"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28V15App clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          set -euo pipefail
          APP="android/OrbisG28V15App"
          mkdir -p dist/source
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Lab-v1.5.apk
          cp -R "$APP"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -qr ../Orbis-G28-Lab-v1.5-source.zip .)
          sha256sum dist/Orbis-G28-Lab-v1.5.apk | tee dist/Orbis-G28-Lab-v1.5.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.5
          path: |
            dist/Orbis-G28-Lab-v1.5.apk
            dist/Orbis-G28-Lab-v1.5.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.5-source
          path: dist/Orbis-G28-Lab-v1.5-source.zip
          if-no-files-found: error
          retention-days: 30
