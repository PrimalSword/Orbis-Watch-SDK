name: Build Orbis G28 Recovery Studio

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-recovery-studio-v01"]
    paths:
      - "windows/orbis_g28_recovery_studio/**"
      - "tests/test_recovery_studio_protocol.py"
      - ".github/workflows/build-orbis-g28-recovery-studio.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "windows/orbis_g28_recovery_studio/**"
      - "tests/test_recovery_studio_protocol.py"
      - ".github/workflows/build-orbis-g28-recovery-studio.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_recovery_studio_protocol.py
      - run: python -m py_compile windows/orbis_g28_recovery_studio/*.py

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build requirements
        shell: pwsh
        run: python -m pip install -r windows/orbis_g28_recovery_studio/requirements.txt
      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Orbis-G28-Recovery-Studio-v0.1 `
            --collect-all bleak `
            --paths windows/orbis_g28_recovery_studio `
            windows/orbis_g28_recovery_studio/app.py
      - name: Package source and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-package | Out-Null
          Copy-Item dist/Orbis-G28-Recovery-Studio-v0.1.exe dist-package/
          Compress-Archive -Path windows/orbis_g28_recovery_studio/* -DestinationPath dist-package/Orbis-G28-Recovery-Studio-v0.1-source.zip
          (Get-FileHash dist-package/Orbis-G28-Recovery-Studio-v0.1.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii dist-package/Orbis-G28-Recovery-Studio-v0.1.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Recovery-Studio-v0.1-Windows
          path: dist-package/*
          if-no-files-found: error
          retention-days: 30
