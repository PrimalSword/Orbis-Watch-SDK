name: Validate Orbis G28 Recovery Studio source

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-recovery-studio-v01"]
    paths:
      - "windows/orbis_g28_recovery_studio/**"
      - "tests/test_recovery_studio_protocol.py"
      - ".github/workflows/build-orbis-g28-recovery-studio.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "windows/orbis_g28_recovery_studio/**"
      - "tests/test_recovery_studio_protocol.py"
      - ".github/workflows/build-orbis-g28-recovery-studio.yml"

permissions:
  contents: read

jobs:
  test-and-package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: python -m pip install pytest
      - name: Run protocol tests
        run: pytest -q tests/test_recovery_studio_protocol.py
      - name: Compile-check source
        run: python -m py_compile windows/orbis_g28_recovery_studio/*.py
      - name: Verify no executable packager is present
        run: |
          ! grep -RinE 'pyinstaller|cx_Freeze|nuitka|auto-py-to-exe' windows/orbis_g28_recovery_studio .github/workflows/build-orbis-g28-recovery-studio.yml
      - name: Package readable source only
        run: |
          mkdir -p dist-package/source
          cp -R windows/orbis_g28_recovery_studio/. dist-package/source/
          printf 'This artifact contains readable Python source only. No EXE, DLL, installer, obfuscator, or executable packager is included.\n' > dist-package/SECURITY-NOTICE.txt
          (cd dist-package/source && zip -qr ../Orbis-G28-Recovery-Studio-v0.1-source-only.zip .)
          sha256sum dist-package/Orbis-G28-Recovery-Studio-v0.1-source-only.zip > dist-package/Orbis-G28-Recovery-Studio-v0.1-source-only.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Recovery-Studio-v0.1-source-only
          path: dist-package/*
          if-no-files-found: error
          retention-days: 30
