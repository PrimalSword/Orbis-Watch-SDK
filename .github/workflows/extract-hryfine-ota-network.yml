name: Extract HryFine OTA network flow

on:
  workflow_dispatch:
  push:
    branches: ["hryfine-389-extract-5610-methods"]
    paths:
      - ".github/workflows/extract-hryfine-ota-network.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-hryfine-ota-network.yml"

permissions:
  contents: read

jobs:
  extract-network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download HryFine and JADX
        run: |
          set -euo pipefail
          mkdir -p work out/selected
          curl --fail --location --retry 5 --retry-all-errors --user-agent "Mozilla/5.0" \
            "https://d.apkpure.net/b/APK/com.lianhezhuli.hyfit?version=latest" -o work/HryFine.apk
          unzip -p work/HryFine.apk classes6.dex > work/classes6.dex
          URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n 1)
          curl --fail --location --retry 5 "$URL" -o work/jadx.zip
          mkdir -p work/jadx
          unzip -q work/jadx.zip -d work/jadx
          sha256sum work/HryFine.apk | tee out/apk.sha256

      - name: Decompile and collect OTA request flow
        run: |
          set -euo pipefail
          set +e
          work/jadx/bin/jadx --show-bad-code --deobf --threads-count 4 -d work/decompiled work/classes6.dex \
            2>&1 | tee out/jadx.log
          set -e
          SRC=work/decompiled/sources
          for f in \
            "$SRC/com/lianhezhuli/hyfit/function/device/DeviceOtaActivity.java" \
            "$SRC/com/lianhezhuli/hyfit/network/bean/OtaUpdateInfo.java"; do
            test -s "$f"
            cp "$f" out/selected/
          done
          grep -RIlE 'hry/get_update|hry/force_update|api/ota/down_|getFirmwareConfig|unique_code|OtaUpdateInfo' "$SRC/com/lianhezhuli/hyfit" \
            | sort | tee out/matching-files.txt
          while IFS= read -r f; do
            rel=${f#"$SRC/"}
            dest="out/selected/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < out/matching-files.txt
          grep -RInE 'hry/get_update|hry/force_update|api/ota/down_|getFirmwareConfig|unique_code|version|project|device_type|product_id|OtaUpdateInfo' \
            out/selected > out/relevant-network-lines.txt || true
          tar -czf out/HryFine-OTA-network-selected.tar.gz -C out/selected .

      - name: Upload network extraction
        uses: actions/upload-artifact@v4
        with:
          name: HryFine-3.8.9-OTA-network-flow
          path: out/
          if-no-files-found: error
          retention-days: 30
