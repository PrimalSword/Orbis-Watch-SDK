name: Build Orbis G28 Silicon Census

on:
  workflow_dispatch:
  push:
    branches: ["g28-silicon-census-v0-5"]
    paths:
      - "android/OrbisG28SiliconCensus/**"
      - ".github/workflows/build-orbis-g28-silicon-census.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28SiliconCensus/**"
      - ".github/workflows/build-orbis-g28-silicon-census.yml"

permissions:
  contents: read

jobs:
  build-silicon-census:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="android/OrbisG28SiliconCensus"
          APP="$ROOT/g28_silicon_census"
          mkdir -p "$APP"
          cat "$ROOT"/source.part*.b64 | base64 -d > /tmp/g28-silicon-census.tar.xz
          echo "dedc374e7597e075bb70d8ce0538678650f22c79eab86bca5af9a1f6c5002fff  /tmp/g28-silicon-census.tar.xz" | sha256sum -c -
          tar -xJf /tmp/g28-silicon-census.tar.xz -C "$APP"
          test -s "$APP/app/src/main/java/com/orbisg28siliconcensus/MainActivity.java"
          test -s "$APP/app/src/main/java/com/orbisg28siliconcensus/CollectorUserService.java"
          test -s "$APP/app/src/main/aidl/com/orbisg28siliconcensus/ICollectorUserService.aidl"
          test -s "$APP/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp"

      - name: Validate safe scope, icon and OTA analyzer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("android/OrbisG28SiliconCensus/g28_silicon_census")
          source = (root / "app/src/main/java/com/orbisg28siliconcensus/MainActivity.java").read_text()
          service = (root / "app/src/main/java/com/orbisg28siliconcensus/CollectorUserService.java").read_text()
          aidl = (root / "app/src/main/aidl/com/orbisg28siliconcensus/ICollectorUserService.aidl").read_text()
          manifest = (root / "app/src/main/AndroidManifest.xml").read_text()
          gradle = (root / "app/build.gradle").read_text()

          for token in (
              '41:42:99:10:58:57', '41:42:99:10:58:02',
              'buildNusFrame(0xF3', 'HCI BR/EDR FEATURES page=0',
              'HCI LE FEATURES page=0', 'HCI DUAL IDENTITY CONSISTENT',
              'ANALISAR PACOTE OTA / BIN_LIST', 'analyzeOtaPackage',
              'g28_ota_static_analysis_', 'part_id', 'part_addr', 'part_len',
              'bin_file', 'BT8918D', 'BT8918C', 'BT8918F',
              'Somente leitura local; nenhum comando foi transmitido ao relógio'):
              assert token in source, token

          for token in ('bugreportz', 'collectBugreport', 'ParcelFileDescriptor',
                        'sourceDeleted=', '/bugreports/'):
              assert token in service, token

          for token in ('000018a8-', '00002aa9-', '6e40ff01-', '6e40ff02-',
                        'watchface_frames', 'rawToPar', 'requestStartOTA',
                        'buildOfficial5610Request', 'FLASH_READ', 'RAM_EXEC',
                        'JUMP_ADDRESS'):
              assert token not in source, token

          assert source.count('writeCharacteristic(') == 2
          assert source.count('writeDescriptor(') == 2
          assert 'void destroy() = 16777114;' in aidl
          assert 'rikka.shizuku.ShizukuProvider' in manifest
          assert 'android:icon="@mipmap/ic_launcher"' in manifest
          assert "versionName '0.5-ota-static-analyzer'" in gradle
          assert 'minSdk 24' in gradle
          assert 'dev.rikka.shizuku:api:13.1.5' in gradle
          print('Silicon Census v0.5 safe OTA analyzer and launcher icon validated')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28SiliconCensus/g28_silicon_census clean assembleDebug --stacktrace

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="android/OrbisG28SiliconCensus/g28_silicon_census"
          mkdir -p dist/source
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Silicon-Census-v0.5.apk
          cp -R "$ROOT"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -r ../Orbis-G28-Silicon-Census-v0.5-source.zip .)
          sha256sum dist/Orbis-G28-Silicon-Census-v0.5.apk | tee dist/Orbis-G28-Silicon-Census-v0.5.apk.sha256
          sha256sum dist/Orbis-G28-Silicon-Census-v0.5-source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Silicon-Census-v0.5
          path: |
            dist/Orbis-G28-Silicon-Census-v0.5.apk
            dist/Orbis-G28-Silicon-Census-v0.5.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Silicon-Census-v0.5-source
          path: dist/Orbis-G28-Silicon-Census-v0.5-source.zip
          if-no-files-found: error
          retention-days: 30
