name: Build Orbis G28 Silicon Census

on:
  workflow_dispatch:
  push:
    branches: ["g28-silicon-census-v0-1"]
    paths:
      - "android/OrbisG28SiliconCensus/**"
      - ".github/workflows/build-orbis-g28-silicon-census.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28SiliconCensus/**"
      - ".github/workflows/build-orbis-g28-silicon-census.yml"

permissions:
  contents: read

jobs:
  build-silicon-census:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source snapshot
        shell: bash
        run: |
          set -euo pipefail
          ROOT="android/OrbisG28SiliconCensus"
          cat "$ROOT"/source.part*.b64 | base64 -d > /tmp/g28-silicon-census.tar.xz
          echo "c5045794b318f0cdee1ecbb7214e2d2be4251e661da61b70034304bc09ac6ee9  /tmp/g28-silicon-census.tar.xz" | sha256sum -c -
          tar -xJf /tmp/g28-silicon-census.tar.xz -C "$ROOT"
          test -s "$ROOT/g28_silicon_census/app/src/main/java/com/orbisg28siliconcensus/MainActivity.java"
          test -s "$ROOT/g28_silicon_census/app/src/main/AndroidManifest.xml"

      - name: Validate read-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("android/OrbisG28SiliconCensus/g28_silicon_census")
          source = (root / "app/src/main/java/com/orbisg28siliconcensus/MainActivity.java").read_text()
          manifest = (root / "app/src/main/AndroidManifest.xml").read_text()
          gradle = (root / "app/build.gradle").read_text()

          required = (
              '41:42:99:10:58:57',
              'buildNusFrame(0xF3',
              'Read Remote Version Information',
              'manufacturer=0x%04X',
              '0x050E',
              '0x0642',
              'fetchUuidsWithSdp',
              '00002a50',
              'Downloads/OrbisG28SiliconCensus',
          )
          for token in required:
              assert token in source, token

          forbidden = (
              '000018a8-',
              '00002aa9-',
              '6e40ff01-',
              '6e40ff02-',
              'watchface_frames',
              'rawToPar',
              'requestStartOTA',
              'buildOfficial5610Request',
              'DF0006FD130102000101',
              'FLASH_READ',
              'RAM_EXEC',
              'JUMP_ADDRESS',
          )
          for token in forbidden:
              assert token not in source, token

          assert source.count('writeCharacteristic(') == 2
          assert source.count('writeDescriptor(') == 2
          assert 'android.permission.BLUETOOTH_SCAN' in manifest
          assert "applicationId 'com.orbisg28siliconcensus'" in gradle
          assert "versionName '0.1-silicon-census'" in gradle
          print('Silicon Census read-only scope validated')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28SiliconCensus/g28_silicon_census clean assembleDebug --stacktrace

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="android/OrbisG28SiliconCensus/g28_silicon_census"
          mkdir -p dist/source
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Silicon-Census-v0.1.apk
          cp -R "$ROOT"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -r ../Orbis-G28-Silicon-Census-v0.1-source.zip .)
          sha256sum dist/Orbis-G28-Silicon-Census-v0.1.apk | tee dist/Orbis-G28-Silicon-Census-v0.1.apk.sha256
          sha256sum dist/Orbis-G28-Silicon-Census-v0.1-source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Silicon-Census-v0.1
          path: |
            dist/Orbis-G28-Silicon-Census-v0.1.apk
            dist/Orbis-G28-Silicon-Census-v0.1.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Silicon-Census-v0.1-source
          path: dist/Orbis-G28-Silicon-Census-v0.1-source.zip
          if-no-files-found: error
          retention-days: 30
