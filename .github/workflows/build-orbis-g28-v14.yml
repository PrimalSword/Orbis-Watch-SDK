name: Build Orbis G28 Lab v1.4 ACK-aware Rescue

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-lab-v1-4-ack-aware-rescue"]
    paths:
      - "android/OrbisG28Unified/patch_v14_ack_aware_rescue.py"
      - ".github/workflows/build-orbis-g28-v14.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28Unified/patch_v14_ack_aware_rescue.py"
      - ".github/workflows/build-orbis-g28-v14.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.3 source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8840534999/zip" \
            -o /tmp/v13-source-artifact.zip
          mkdir -p /tmp/v13-artifact android/OrbisG28V14App
          unzip -q /tmp/v13-source-artifact.zip -d /tmp/v13-artifact
          test -s /tmp/v13-artifact/Orbis-G28-Lab-v1.3-source.zip
          unzip -q /tmp/v13-artifact/Orbis-G28-Lab-v1.3-source.zip -d android/OrbisG28V14App
          test -s android/OrbisG28V14App/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java

      - name: Apply v1.4 ACK-aware rescue patch
        run: |
          set -euo pipefail
          python android/OrbisG28Unified/patch_v14_ack_aware_rescue.py android/OrbisG28V14App

      - name: Validate ACK-aware state machine
        run: |
          set -euo pipefail
          APP="android/OrbisG28V14App"
          JAVA="$APP/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java"
          MAIN="$APP/app/src/main/java/com/orbisg28siliconcensus/MainActivity.java"
          grep -q "RESGATE v1.4" "$JAVA"
          grep -q "WRITE_NR_SERIAL_V14" "$JAVA"
          grep -q "completeMatchingOtaWriteFromD6" "$JAVA"
          grep -q "if (status == 1) completeMatchingOtaWriteFromD6(command)" "$JAVA"
          grep -q "OTA WRITE_NR callback informativo ignorado" "$JAVA"
          grep -q "firstValidHandshake" "$JAVA"
          grep -q "respostas duplicadas serão ignoradas" "$JAVA"
          grep -q "schedule(140" "$JAVA"
          grep -q "versionCode 140" "$APP/app/build.gradle"
          grep -q "versionName '1.4-ack-aware-rescue'" "$APP/app/build.gradle"
          grep -q "v1.4 — resgate ACK-aware" "$MAIN"
          ! grep -q "WRITE_TYPE_DEFAULT len=" "$JAVA"
          echo "Orbis G28 Lab v1.4 ACK-aware rescue validation passed"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28V14App clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          set -euo pipefail
          APP="android/OrbisG28V14App"
          mkdir -p dist/source
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Lab-v1.4.apk
          cp -R "$APP"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -qr ../Orbis-G28-Lab-v1.4-source.zip .)
          sha256sum dist/Orbis-G28-Lab-v1.4.apk | tee dist/Orbis-G28-Lab-v1.4.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.4
          path: |
            dist/Orbis-G28-Lab-v1.4.apk
            dist/Orbis-G28-Lab-v1.4.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.4-source
          path: dist/Orbis-G28-Lab-v1.4-source.zip
          if-no-files-found: error
          retention-days: 30
