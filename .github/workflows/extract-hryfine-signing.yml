name: Extract HryFine request signing

on:
  workflow_dispatch:
  push:
    branches: ["hryfine-389-extract-5610-methods"]
    paths:
      - ".github/workflows/extract-hryfine-signing.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-hryfine-signing.yml"

permissions:
  contents: read

jobs:
  extract-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download APK and JADX
        run: |
          set -euo pipefail
          mkdir -p work out/selected
          curl --fail --location --retry 5 --retry-all-errors --user-agent "Mozilla/5.0" \
            "https://d.apkpure.net/b/APK/com.lianhezhuli.hyfit?version=latest" -o work/HryFine.apk
          unzip -p work/HryFine.apk classes6.dex > work/classes6.dex
          URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n 1)
          curl --fail --location --retry 5 "$URL" -o work/jadx.zip
          mkdir -p work/jadx
          unzip -q work/jadx.zip -d work/jadx

      - name: Decompile and extract signing implementation
        run: |
          set -euo pipefail
          set +e
          work/jadx/bin/jadx --show-bad-code --deobf --threads-count 4 -d work/decompiled work/classes6.dex \
            2>&1 | tee out/jadx.log
          set -e
          SRC=work/decompiled/sources
          find "$SRC" -type f \( -name 'SignUtils.java' -o -name 'Constans.java' -o -name 'MD5*.java' -o -name 'Encrypt*.java' \) \
            | sort | tee out/candidate-files.txt
          while IFS= read -r f; do
            rel=${f#"$SRC/"}
            dest="out/selected/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < out/candidate-files.txt
          grep -RIlE 'getQueryMap\(|getPubQueryMap\(|getSign\(|ead8ff5fe2f9385b55e6e509cf311a35|oaa648257e8' "$SRC/com/lianhezhuli/hyfit" \
            | sort | tee out/reference-files.txt
          while IFS= read -r f; do
            rel=${f#"$SRC/"}
            dest="out/selected/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < out/reference-files.txt
          grep -RInE 'getQueryMap\(|getPubQueryMap\(|getSign\(|ead8ff5fe2f9385b55e6e509cf311a35|oaa648257e8|timestamp|app_key|app_id|nonce|language|country|timezone' \
            out/selected > out/relevant-sign-lines.txt || true
          tar -czf out/HryFine-signing-selected.tar.gz -C out/selected .

      - name: Upload signing extraction
        uses: actions/upload-artifact@v4
        with:
          name: HryFine-3.8.9-request-signing
          path: out/
          if-no-files-found: error
          retention-days: 30
