name: Build Orbis G28 Lab v1.3 Rescue

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-lab-v1-3-bootloader-rescue"]
    paths:
      - "android/OrbisG28Unified/v13chunks/**"
      - "android/OrbisG28Unified/patch_v13_postfinish_scan.py"
      - ".github/workflows/build-orbis-g28-v13.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28Unified/v13chunks/**"
      - "android/OrbisG28Unified/patch_v13_postfinish_scan.py"
      - ".github/workflows/build-orbis-g28-v13.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.2 source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8839929414/zip" \
            -o /tmp/v12-source-artifact.zip
          mkdir -p /tmp/v12-artifact android/OrbisG28V13App
          unzip -q /tmp/v12-source-artifact.zip -d /tmp/v12-artifact
          test -s /tmp/v12-artifact/Orbis-G28-Lab-v1.2-source.zip
          unzip -q /tmp/v12-artifact/Orbis-G28-Lab-v1.2-source.zip -d android/OrbisG28V13App
          test -s android/OrbisG28V13App/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java

      - name: Apply v1.3 bootloader rescue patch
        run: |
          set -euo pipefail
          CHUNKS="android/OrbisG28Unified/v13chunks"
          echo "a75896dc6900c55048f72757864ff1e22b8d3be818f48f84474fb51c3cad0a80  $CHUNKS/chunk00.b64" | sha256sum -c -
          echo "16962f43a26625dc120d418e58ff2218e78484665c0a572b7e20e9c4c93ae630  $CHUNKS/chunk01.b64" | sha256sum -c -
          echo "80f3eaec4d0d6cc8c0653ce1fd352393e081ea02646776974265badc73a5f142  $CHUNKS/chunk02.b64" | sha256sum -c -
          echo "ae9049e2cf2732730c22db863bc549bc9b7e1d81d0bd63474286308511c32a1b  $CHUNKS/chunk03.b64" | sha256sum -c -
          echo "fc407ecc4e81539d265851f6ed7789961c2372b032edaf20e8c2fd5c0af11c67  $CHUNKS/chunk04.b64" | sha256sum -c -
          echo "655107da2e989a3f38a452c30bb8ca7ea64c7b48b3e00877d1dea075fed32125  $CHUNKS/chunk05.b64" | sha256sum -c -
          echo "b16f70ed279a24932fdbbd00a0e71afca34bffe985833177270601e63de0fa40  $CHUNKS/chunk06.b64" | sha256sum -c -
          echo "cc0eca1e76688050e56b93594eee3e270182fb04431a404aa80e3a010478d6d7  $CHUNKS/chunk07.b64" | sha256sum -c -
          echo "d444b018377c40c7c73773952b40a58c803992d98a5fa3cf1bdd33aebcab842e  $CHUNKS/chunk08.b64" | sha256sum -c -
          echo "59f684101347ac33a4d4110e702802199b21ed8a1da4d7eee0f24697d6852726  $CHUNKS/chunk09.b64" | sha256sum -c -
          cat "$CHUNKS"/chunk*.b64 > /tmp/patch_v13_bootloader_rescue.patch.gz.b64
          echo "97a2c65d25a01fb6b76bbb4644c95f3e8a644f55a27ea750765a3029cf04bdee  /tmp/patch_v13_bootloader_rescue.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/patch_v13_bootloader_rescue.patch.gz.b64 | gzip -dc > /tmp/patch_v13_bootloader_rescue.patch
          cd android/OrbisG28V13App
          patch -p1 < /tmp/patch_v13_bootloader_rescue.patch
          cd "$GITHUB_WORKSPACE"
          python android/OrbisG28Unified/patch_v13_postfinish_scan.py android/OrbisG28V13App

      - name: Validate rescue transport and scope
        run: |
          set -euo pipefail
          APP="android/OrbisG28V13App"
          JAVA="$APP/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java"
          MAIN="$APP/app/src/main/java/com/orbisg28siliconcensus/MainActivity.java"
          grep -q "RESGATE v1.3" "$JAVA"
          grep -q "RESGATAR G28 PRESO NO BOOTLOADER .02" "$JAVA"
          grep -q "requestMtu(256)" "$JAVA"
          grep -q "negotiatedMtu - 14" "$JAVA"
          grep -q "negotiatedMtu - 3" "$JAVA"
          grep -q "WRITE_TYPE_DEFAULT" "$JAVA"
          grep -q "completeOtaWriteSuccess" "$JAVA"
          grep -q "otaTxQueue.peekFirst" "$JAVA"
          grep -q "expectedFragments > 256" "$JAVA"
          grep -q "startPostRescueRuntimeScan" "$JAVA"
          grep -q "!emergencyStopped && !bootloaderRescueMode" "$JAVA"
          grep -q "otaTransitionScanArmed = false" "$JAVA"
          grep -q "otaReconnectInProgress = false" "$JAVA"
          grep -q "RESGATAR G28 PRESO NO BOOTLOADER .02" "$MAIN"
          ! grep -q "Math.max(20, Math.min(240, negotiatedMtu - 14))" "$JAVA"
          grep -q "versionCode 130" "$APP/app/build.gradle"
          grep -q "versionName '1.3-bootloader-rescue'" "$APP/app/build.gradle"
          echo "Orbis G28 Lab v1.3 rescue validation passed"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28V13App clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          set -euo pipefail
          APP="android/OrbisG28V13App"
          mkdir -p dist/source
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Lab-v1.3.apk
          cp -R "$APP"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -qr ../Orbis-G28-Lab-v1.3-source.zip .)
          sha256sum dist/Orbis-G28-Lab-v1.3.apk | tee dist/Orbis-G28-Lab-v1.3.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.3
          path: |
            dist/Orbis-G28-Lab-v1.3.apk
            dist/Orbis-G28-Lab-v1.3.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.3-source
          path: dist/Orbis-G28-Lab-v1.3-source.zip
          if-no-files-found: error
          retention-days: 30
