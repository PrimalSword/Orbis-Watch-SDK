name: Extract HryFine signing primitives

on:
  workflow_dispatch:
  push:
    branches: ["hryfine-389-extract-5610-methods"]
    paths:
      - ".github/workflows/extract-hryfine-sign-primitives.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-hryfine-sign-primitives.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and decompile
        run: |
          set -euo pipefail
          mkdir -p work out
          curl --fail --location --retry 5 --retry-all-errors --user-agent "Mozilla/5.0" \
            "https://d.apkpure.net/b/APK/com.lianhezhuli.hyfit?version=latest" -o work/HryFine.apk
          unzip -p work/HryFine.apk classes6.dex > work/classes6.dex
          URL=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-[0-9.]+\\.zip$")) | .browser_download_url' | head -n1)
          curl -fL "$URL" -o work/jadx.zip
          mkdir -p work/jadx && unzip -q work/jadx.zip -d work/jadx
          set +e
          work/jadx/bin/jadx --show-bad-code --deobf --threads-count 4 -d work/decompiled work/classes6.dex >out/jadx.log 2>&1
          set -e
          SRC=work/decompiled/sources
          find "$SRC" -type f \( -name 'StringUtils.java' -o -name 'PhoneDeviceUtil.java' \) -print -exec cp {} out/ \;
          grep -RInE 'getRandomNum\(|md5Encode32\(|getSystemLanguage\(' out/*.java > out/relevant.txt || true
          test -s out/StringUtils.java
          test -s out/PhoneDeviceUtil.java
      - uses: actions/upload-artifact@v4
        with:
          name: HryFine-signing-primitives
          path: out/
          if-no-files-found: error
          retention-days: 30
