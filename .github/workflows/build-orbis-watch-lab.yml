name: Build Orbis Watch OTA 5610 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/OrbisWatchLab/**"
      - ".github/workflows/build-orbis-watch-lab.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisWatchLab/**"
      - ".github/workflows/build-orbis-watch-lab.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble v3.4 base and apply v3.5 D5 patch
        run: |
          : > android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          for f in android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/v34/MainActivity.java.v34.part*.b64; do
            base64 -d "$f" >> android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          done
          python android/OrbisWatchLab/tools/patch_v35.py \
            android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/fix_v35_java_quotes.py \
            android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          test -s android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "Orbis Watch OTA 5610 v3.5" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "buildOfficial5610Request" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          ! grep -q 'ASCII=""' android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisWatchLab clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          mkdir -p dist/source
          cp android/OrbisWatchLab/app/build/outputs/apk/debug/app-debug.apk \
             dist/Orbis-Watch-OTA-5610-v3.5.apk
          cp android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java dist/source/
          cp android/OrbisWatchLab/app/src/main/AndroidManifest.xml dist/source/
          cp android/OrbisWatchLab/app/build.gradle dist/source/app-build.gradle
          cd dist/source && zip -r ../Orbis-Watch-OTA-5610-v3.5-source.zip .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Watch-OTA-5610-v3.5
          path: dist/Orbis-Watch-OTA-5610-v3.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Watch-OTA-5610-v3.5-source
          path: dist/Orbis-Watch-OTA-5610-v3.5-source.zip
          if-no-files-found: error
          retention-days: 30
