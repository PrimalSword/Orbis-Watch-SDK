name: Build Orbis Watch Lab APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/OrbisWatchLab/**"
      - ".github/workflows/build-orbis-watch-lab.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisWatchLab clean assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/OrbisWatchLab/app/build/outputs/apk/debug/app-debug.apk \
             dist/Orbis-Watch-Lab-v2-emergency.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Watch-Lab-v2-emergency
          path: dist/Orbis-Watch-Lab-v2-emergency.apk
          if-no-files-found: error
          retention-days: 30
