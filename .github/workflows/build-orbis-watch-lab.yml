name: Build Orbis Watch OTA 5610 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/OrbisWatchLab/**"
      - ".github/workflows/build-orbis-watch-lab.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisWatchLab/**"
      - ".github/workflows/build-orbis-watch-lab.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble v3.19 source
        run: |
          cat android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/v36/MainActivity.java.v36.gz.part*.b64 \
            | tr -d '\n\r' \
            | base64 -d \
            | gzip -dc \
            > android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v37_server_appid.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v38_exact_auth.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v39_uppercase_sign.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v310_server_latest.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v311_bootloader_entry.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v312_resilient_discovery.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v313_observed_transport.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v314_write_nr_probe.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v315_protocol_handshake.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v316_official_d5_handshake.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v317_info_after_handshake.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v318_preservation_baseline.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          python android/OrbisWatchLab/tools/patch_v319_runtime_capability_survey.py android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          test -s android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "Orbis Watch OTA 5610 v3.19" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "8. Consultar configurações atuais — NUS 0x09/0x00" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "9. Consultar identificação do produto — NUS 0x20/0x00" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "10. Escutar notificações passivas por 30 s — sem TX" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "11. Gerar relatório runtime — local" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "RUNTIME SETTINGS RX" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "RUNTIME PRODUCT RX" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "CAPTURA PASSIVA concluída" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java
          grep -q "RELATÓRIO RUNTIME G28 v3.19" android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisWatchLab clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          mkdir -p dist/source
          cp android/OrbisWatchLab/app/build/outputs/apk/debug/app-debug.apk dist/Orbis-Watch-OTA-5610-v3.19.apk
          cp android/OrbisWatchLab/app/src/main/java/com/orbiswatchlab/MainActivity.java dist/source/
          cp android/OrbisWatchLab/app/src/main/AndroidManifest.xml dist/source/
          cp android/OrbisWatchLab/app/build.gradle dist/source/app-build.gradle
          cp android/OrbisWatchLab/DOOM_FIRMWARE_REQUIREMENTS.md dist/source/
          cd dist/source && zip -r ../Orbis-Watch-OTA-5610-v3.19-source.zip .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Watch-OTA-5610-v3.19
          path: dist/Orbis-Watch-OTA-5610-v3.19.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Watch-OTA-5610-v3.19-source
          path: dist/Orbis-Watch-OTA-5610-v3.19-source.zip
          if-no-files-found: error
          retention-days: 30
