name: Diagnose Orbis G28 Inferno Snapshot

on:
  push:
    branches: ["g28-inferno-sender-v0-2"]
    paths:
      - "android/OrbisG28InfernoSender/**"
      - ".github/workflows/diagnose-orbis-g28-inferno-snapshot.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28InfernoSender/**"
      - ".github/workflows/diagnose-orbis-g28-inferno-snapshot.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect encoded snapshot
        shell: bash
        run: |
          set -u
          ROOT="android/OrbisG28InfernoSender"
          find "$ROOT" -maxdepth 1 -name 'source.part*.b64' -print0 | sort -z | xargs -0 -r wc -c
          find "$ROOT" -maxdepth 1 -name 'source.part*.b64' -print0 | sort -z | xargs -0 -r sha256sum
          printf 'ORDER\n'
          printf '%s\n' "$ROOT"/source.part*.b64
          cat "$ROOT"/source.part*.b64 > /tmp/snapshot.b64
          wc -c /tmp/snapshot.b64
          sha256sum /tmp/snapshot.b64
          base64 -d /tmp/snapshot.b64 > /tmp/snapshot.tar.xz
          wc -c /tmp/snapshot.tar.xz
          sha256sum /tmp/snapshot.tar.xz
