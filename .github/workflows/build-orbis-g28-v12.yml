name: Build Orbis G28 Lab v1.2

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-lab-v1-2-transfer-fix"]
    paths:
      - "android/OrbisG28Unified/patch_v12_transfer_fix.py.gz.b64"
      - ".github/workflows/build-orbis-g28-v12.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/OrbisG28Unified/patch_v12_transfer_fix.py.gz.b64"
      - ".github/workflows/build-orbis-g28-v12.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified v1.1 source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8839612744/zip" \
            -o /tmp/v11-source-artifact.zip
          mkdir -p /tmp/v11-artifact android/OrbisG28V12App
          unzip -q /tmp/v11-source-artifact.zip -d /tmp/v11-artifact
          test -s /tmp/v11-artifact/Orbis-G28-Lab-v1.1-source.zip
          unzip -q /tmp/v11-artifact/Orbis-G28-Lab-v1.1-source.zip -d android/OrbisG28V12App
          test -s android/OrbisG28V12App/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java

      - name: Apply v1.2 transfer-state correction
        run: |
          set -euo pipefail
          base64 -d android/OrbisG28Unified/patch_v12_transfer_fix.py.gz.b64 \
            | gzip -dc > /tmp/patch_v12_transfer_fix.py
          python /tmp/patch_v12_transfer_fix.py android/OrbisG28V12App

      - name: Validate corrected destructive state machine
        run: |
          set -euo pipefail
          APP="android/OrbisG28V12App"
          JAVA="$APP/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java"
          grep -q "TUDO OU NADA v1.2" "$JAVA"
          grep -q "private boolean startTransfer(TransferMode mode)" "$JAVA"
          grep -q "if (startTransfer(selectedMode))" "$JAVA"
          grep -q "allOrNothingBootIdentityConfirmed = true" "$JAVA"
          grep -q "PARTITION TABLE D5/0x03 QUEUED" "$JAVA"
          grep -q "FIRST FLASH DATA TX STARTING" "$JAVA"
          grep -q "tableAccepted=" "$JAVA"
          grep -q "flashDataStarted=" "$JAVA"
          ! grep -q "transferMode = allOrNothingFinalize ? TransferMode.FULL" "$JAVA"
          grep -q "versionCode 120" "$APP/app/build.gradle"
          grep -q "versionName '1.2-transfer-state-fix'" "$APP/app/build.gradle"
          echo "Orbis G28 Lab v1.2 state machine verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android/OrbisG28V12App clean assembleDebug --stacktrace

      - name: Package outputs
        run: |
          set -euo pipefail
          APP="android/OrbisG28V12App"
          mkdir -p dist/source
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Lab-v1.2.apk
          cp -R "$APP"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -qr ../Orbis-G28-Lab-v1.2-source.zip .)
          sha256sum dist/Orbis-G28-Lab-v1.2.apk | tee dist/Orbis-G28-Lab-v1.2.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.2
          path: |
            dist/Orbis-G28-Lab-v1.2.apk
            dist/Orbis-G28-Lab-v1.2.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.2-source
          path: dist/Orbis-G28-Lab-v1.2-source.zip
          if-no-files-found: error
          retention-days: 30
