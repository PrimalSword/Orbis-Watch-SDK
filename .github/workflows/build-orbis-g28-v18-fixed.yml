name: Build Orbis G28 Lab v1.8 Fixed

on:
  workflow_dispatch:
  push:
    branches: ["orbis-g28-lab-v1-8-valid-dial-command"]
    paths:
      - ".github/workflows/build-orbis-g28-v18-fixed.yml"
      - "android/OrbisG28V18/patch_v18.py"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-orbis-g28-v18-fixed.yml"
      - "android/OrbisG28V18/patch_v18.py"

permissions:
  contents: read
  actions: read

jobs:
  build-v18-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified v1.7 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8841304373/zip" -o /tmp/v17.zip
          mkdir -p /tmp/v17 android/OrbisG28V18App
          unzip -q /tmp/v17.zip -d /tmp/v17
          unzip -q /tmp/v17/Orbis-G28-Lab-v1.7-source.zip -d android/OrbisG28V18App
      - name: Apply and validate v1.8 patch
        run: |
          set -euo pipefail
          python3 android/OrbisG28V18/patch_v18.py
          APP=android/OrbisG28V18App
          JAVA="$APP/app/src/main/java/com/orbisg28siliconcensus/ActiveLabActivity.java"
          grep -q 'allOrNothingPartId = 0x09' "$JAVA"
          grep -q 'FUN_DIAL_AREA' "$JAVA"
          grep -q 'ORBIS_G28_DIAL_AREA_FLASH_PROBE_V2' "$JAVA"
          grep -q 'callback GATT WRITE_NR v1.8' "$JAVA"
          grep -q 'timeout aguardando callback WRITE_NR status=0' "$JAVA"
          grep -q 'D6/0x02 curto' "$JAVA"
          grep -q 'PAYLOAD 5610 OFICIAL: MTU-14=' "$JAVA"
          grep -q 'slots=10 payload_len=' "$JAVA"
          ! grep -q 'allOrNothingPartId = 0x7E' "$JAVA"
          grep -q 'versionCode 180' "$APP/app/build.gradle"
          grep -q "versionName '1.8-valid-dial-command'" "$APP/app/build.gradle"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android/OrbisG28V18App clean assembleDebug --stacktrace
      - name: Package
        run: |
          set -euo pipefail
          APP=android/OrbisG28V18App
          mkdir -p dist/source
          cp "$APP/app/build/outputs/apk/debug/app-debug.apk" dist/Orbis-G28-Lab-v1.8.apk
          cp -R "$APP"/. dist/source/
          rm -rf dist/source/app/build dist/source/.gradle
          (cd dist/source && zip -qr ../Orbis-G28-Lab-v1.8-source.zip .)
          sha256sum dist/Orbis-G28-Lab-v1.8.apk | tee dist/Orbis-G28-Lab-v1.8.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.8-fixed
          path: |
            dist/Orbis-G28-Lab-v1.8.apk
            dist/Orbis-G28-Lab-v1.8.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Orbis-G28-Lab-v1.8-source-fixed
          path: dist/Orbis-G28-Lab-v1.8-source.zip
          if-no-files-found: error
          retention-days: 30
