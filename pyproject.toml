[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-watch-sdk"
version = "0.2.0"
description = "Independent Python SDK and BLE protocol implementation for HryFine-compatible smartwatches."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "PrimalSword"}
]
dependencies = [
  "bleak>=0.22,<2"
]

[project.scripts]
orbis-watch = "orbis_watch.cli:main"
orbis-firmware = "orbis_watch.firmware.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["orbis_watch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
