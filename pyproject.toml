[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbis-watch-sdk"
version = "0.3.0.dev1"
description = "Independent Python SDK and BLE reverse-engineering toolkit for HryFine-compatible smartwatches."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "PrimalSword"}
]
dependencies = [
  "bleak>=0.22,<2"
]

[project.scripts]
orbis-watch = "orbis_watch.cli_v03:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["orbis_watch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
